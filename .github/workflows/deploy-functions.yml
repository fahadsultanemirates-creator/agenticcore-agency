# Deploys every Supabase edge function on a push to main.
#
# Why this exists: until now this repo had no function deploy at all.
# Merging a PR updated the site (Netlify builds from the repo) but left
# every edge function running whatever was last pushed by hand. On
# 2026-10-17 that gap was a month wide: telegram-webhook, forge-chat and
# widget-chat were all still serving code from 2026-09-16, so an
# owner-only gate that had been merged, reviewed and tested simply was
# not running -- the bot kept answering its owner as if he were a
# stranger, and nothing anywhere said the deploy was stale.
#
# A stale deploy looks exactly like a working one. The CLI already
# computes each function's dependency closure correctly, so the honest
# fix is to stop deploying by hand.
#
# Setup (once): add a repository secret SUPABASE_ACCESS_TOKEN, generated
# at https://supabase.com/dashboard/account/tokens. The project ref below
# is not a secret -- it is already in the client bundle.

name: Deploy edge functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      # config.toml decides each function's verify_jwt. A change to it
      # must trigger a deploy, or the setting sits in the repo while the
      # platform keeps the old one.
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # config.toml names each function's verify_jwt. An entry pointing at
      # a directory that no longer exists fails the deploy step itself --
      # after the type-check and tests have passed, which reads as "the
      # code is fine but shipping is broken" and sends you looking in the
      # wrong place. Three seconds here answers it directly.
      - name: Check config.toml matches the functions on disk
        run: |
          missing=0
          for fn in $(grep -oP '(?<=^\[functions\.)[^]]+' supabase/config.toml); do
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "::error::config.toml declares [functions.$fn] but supabase/functions/$fn does not exist."
              missing=1
            fi
          done
          exit $missing

      # A function that authenticates callers itself must say so in
      # config.toml, or this workflow deploys it with the platform's
      # default JWT gate and silently breaks it. owner-alert (called by
      # Postgres triggers via pg_net) is exactly that case, and its entry
      # was missing when this workflow was written.
      - name: Check self-authenticating functions declare verify_jwt
        run: |
          missing=0
          for fn in owner-alert telegram-webhook payram-webhook; do
            [ -d "supabase/functions/$fn" ] || continue
            if ! grep -q "^\[functions\.$fn\]" supabase/config.toml; then
              echo "::error::supabase/functions/$fn exists but config.toml has no [functions.$fn] entry; it would deploy with verify_jwt on and reject its own caller."
              missing=1
            fi
          done
          exit $missing

      # The entrypoints pull in every _shared module they use, so this
      # covers the whole deployed surface. The *.test.ts files are
      # excluded deliberately: they run under Node, so Deno is the wrong
      # compiler to judge them by -- npm test below is their check.
      #
      # continue-on-error until this has been seen green once. These
      # functions have never been type-checked by CI, so there may be
      # accumulated errors; a brand-new gate that blocks every deploy on
      # day one is worse than the stale deploys this workflow exists to
      # fix. Once a run passes, delete this line so it gates properly.
      - name: Type-check the functions
        continue-on-error: true
        run: deno check supabase/functions/*/index.ts

      - name: Run the tests
        run: npm test

      - name: Deploy all functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # No --no-verify-jwt here: each function's setting comes from
          # config.toml. Deploying them together means the shared modules
          # can never be live in two different versions.
          supabase functions deploy --project-ref ggyphnbnndfuxgkoakhs
