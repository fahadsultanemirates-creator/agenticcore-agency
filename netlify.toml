# The site was a static directory published from the repo root. It is a
# Vite build now, so the build command and publish directory have to be
# stated here -- a repo-level netlify.toml overrides the dashboard
# settings, which means this file is the one place the two can be kept
# in step.
#
# IT ALSO APPLIES TO EVERY OTHER NETLIFY SITE BUILT FROM THIS REPO that
# has no Base directory of its own, which is how adding it broke the
# ac-agency-0002 client site: that site was reading this file, and was
# suddenly told to build the marketing app and publish dist/. A site
# WITH a base directory reads the netlify.toml in that directory instead
# and never sees this one, which is why jobs/README.md tells you to set
# it, and why each job folder now carries its own config.
[build]
  command = "npm run build"
  publish = "dist"

# The pages these replace are deleted. They were the old 54-service site
# on a pink theme (public/main.css's --accent-cyan holds #ff1e9e, which
# is hot pink and not cyan at all), still advertising services Agency no
# longer sells at prices it no longer charges. They are in search results
# and in people's bookmarks, so they redirect rather than 404.
#
# Order matters: Netlify applies redirects top to bottom, so these sit
# above the catch-all.
[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301
  force = true

[[redirects]]
  from = "/packages.html"
  to = "/packages"
  status = 301
  force = true

[[redirects]]
  from = "/how-it-works.html"
  to = "/#how-it-works"
  status = 301
  force = true

[[redirects]]
  from = "/legacy-landing.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

# Netlify serves a matching file before it consults redirects, so every
# legacy /*.html page that still exists wins this rule. It only fires for
# paths with no file behind them -- which is exactly the React router's
# territory.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
