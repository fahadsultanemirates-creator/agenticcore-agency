<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<title>Forge — AgenticCore Agency</title>
<meta name="description" content="Tell Forge what your business needs and get a scoped price, in your own words.">
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="forge.css">
</head>
<body>

<div class="forge-page">
  <header class="forge-header">
    <div class="forge-header-left">
      <button type="button" class="forge-back-btn" id="forgeBackBtn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <span class="forge-header-badge">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/></svg>
      </span>
      <div class="forge-header-titles">
        <p>Forge</p>
        <p>Your task assistant</p>
      </div>
    </div>
    <a href="index.html" class="forge-header-logo">
      <img src="logo-mark.png" alt="">
      AgenticCore<span class="brand-suffix">.Agency</span>
    </a>
  </header>

  <div class="forge-scroll" id="forgeScroll">
    <div class="forge-log" id="forgeLog" aria-live="polite"></div>
  </div>

  <div class="forge-input-area">
    <p class="forge-error" id="forgeError" style="display:none;"></p>
    <div class="forge-suggestions" id="forgeSuggestions"></div>
    <form class="forge-form" id="forgeForm">
      <input type="text" id="forgeInput" placeholder="Tell Forge what you need…" autocomplete="off" maxlength="4000">
      <button type="submit" class="forge-send-btn" id="forgeSendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="forge.js"></script>
</body>
</html>
