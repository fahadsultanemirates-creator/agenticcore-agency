<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<title>Your projects — AgenticCore Agency</title>
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="dash-shell">
  <div id="dashSidebarMount"></div>

  <div class="dash-main">
    <div id="dashTopbarMount"></div>

    <div class="dash-content">
      <div class="projects-page-head">
        <div>
          <h1>Your projects</h1>
          <p>Every order you've placed, kept with the work it belongs to.</p>
        </div>
        <a href="request.html" class="btn btn-primary btn-sm">+ New project</a>
      </div>

      <h2>Pending requests</h2>
      <p class="dash-empty" id="requestsEmpty">You don't have any pending requests.</p>
      <div class="request-list" id="requestsList"></div>

      <h2 style="margin-top:var(--space-xl);">My Projects</h2>
      <p class="dash-empty" id="projectsEmpty">No projects yet — submit a New Request to get started.</p>
      <div class="project-list" id="projectsList"></div>
    </div>
  </div>
</div>

<a href="forge.html" class="forge-fab" aria-label="Chat with Forge" title="Chat with Forge">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/></svg>
  <span>Chat with Forge</span>
</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script src="dashboard-common.js"></script>
<script src="projects.js"></script>
<script src="visit-tracker.js"></script>
</body>
</html>
