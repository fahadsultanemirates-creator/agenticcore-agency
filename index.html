<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Affordable professional websites, custom web applications, AI agents, business dashboards and automation solutions. Build smarter with AgenticCore.agency."
    />
    <meta name="theme-color" content="#080a0d" />
    <link rel="canonical" href="https://agenticcore.agency/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="agenticcore.agency" />
    <meta property="og:url" content="https://agenticcore.agency/" />
    <meta
      property="og:title"
      content="AgenticCore.agency | Websites, AI Agents &amp; Custom Business Automation"
    />
    <meta
      property="og:description"
      content="Affordable professional websites, custom web applications, AI agents, business dashboards and automation solutions. Build smarter with AgenticCore.agency."
    />
    <!-- Built from the cyan logo at 1200x630 on the brand background.
         logo-full.png was the old yellow mark, and it was square, so every
         share preview cropped it. -->
    <meta property="og:image" content="https://agenticcore.agency/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AgenticCore.agency" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="AgenticCore.agency | Websites, AI Agents &amp; Custom Business Automation"
    />
    <meta
      name="twitter:description"
      content="Affordable professional websites, custom web applications, AI agents, business dashboards and automation solutions."
    />
    <meta name="twitter:image" content="https://agenticcore.agency/og-card.jpg" />
    <title>AgenticCore.agency | Websites, AI Agents &amp; Custom Business Automation</title>

    <!-- Self-hosted, so these are same-origin and worth preloading: they
         are needed for the first paint and nothing else requests them. -->
    <link
      rel="preload"
      href="/fonts/inter-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/fraunces-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
