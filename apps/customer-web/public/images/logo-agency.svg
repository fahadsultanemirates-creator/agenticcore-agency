<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer hexagon -->
  <polygon
    points="50,5 91,27.5 91,72.5 50,95 9,72.5 9,27.5"
    stroke="#F014B3"
    stroke-width="5"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Inner hexagon -->
  <polygon
    points="50,22 72,34.5 72,65.5 50,78 28,65.5 28,34.5"
    stroke="#F014B3"
    stroke-width="3.5"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Connector lines: outer corners to inner corners -->
  <line x1="50"  y1="5"    x2="50"  y2="22"   stroke="#F014B3" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="91"  y1="27.5" x2="72"  y2="34.5" stroke="#F014B3" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="91"  y1="72.5" x2="72"  y2="65.5" stroke="#F014B3" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50"  y1="95"   x2="50"  y2="78"   stroke="#F014B3" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="9"   y1="72.5" x2="28"  y2="65.5" stroke="#F014B3" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="9"   y1="27.5" x2="28"  y2="34.5" stroke="#F014B3" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Corner dots on inner hexagon -->
  <circle cx="50"  cy="22"   r="3.5" fill="#F014B3"/>
  <circle cx="72"  cy="34.5" r="3.5" fill="#F014B3"/>
  <circle cx="72"  cy="65.5" r="3.5" fill="#F014B3"/>
  <circle cx="50"  cy="78"   r="3.5" fill="#F014B3"/>
  <circle cx="28"  cy="65.5" r="3.5" fill="#F014B3"/>
  <circle cx="28"  cy="34.5" r="3.5" fill="#F014B3"/>
  <!-- Centre dot -->
  <circle cx="50" cy="50" r="5.5" fill="#F014B3"/>
  <!-- Spokes from centre to inner corners -->
  <line x1="50" y1="50" x2="50"  y2="22"   stroke="#F014B3" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="72"  y2="34.5" stroke="#F014B3" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="72"  y2="65.5" stroke="#F014B3" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="50"  y2="78"   stroke="#F014B3" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="28"  y2="65.5" stroke="#F014B3" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="28"  y2="34.5" stroke="#F014B3" stroke-width="2.5" stroke-linecap="round"/>
</svg>
